version: "3.8"
name: chipa_redis_postgres

services:
  redis:
    image: redis:7.2.13-alpine
    container_name: redis
    hostname: redis
    env_file:
      - .env
      - .env.local
    ports:
      - "6386:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - chipa_network
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  postgres:
    container_name: postgres
    hostname: postgres
    image: postgres:16.3-alpine3.20
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    ports:
      - 5436:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chipa_db
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - chipa_network

networks:
  chipa_network:
    driver: bridge

volumes:
  redis_data:
  pg_data:
  pgadmin_data:
